services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dukaan}
      POSTGRES_USER: ${POSTGRES_USER:-dukaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000 --noreload"
volumes:
  pgdata:
  media:
  static:
