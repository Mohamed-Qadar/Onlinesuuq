name: dukaan
description: Native Android storefront and seller management for independent shops.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  image_picker: 1.2.4
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  url_launcher: 6.3.1
  uuid: 4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - lib/l10n/so.json
    - lib/l10n/en.json
