<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.6; max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.15rem; margin-top: 2rem; }
    a { color: #0b6bcb; }
    .meta { color: #666; font-size: .9rem; }
    footer { margin-top: 3rem; border-top: 1px solid #ccc; padding-top: 1rem; color: #666; font-size: .85rem; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
  <footer>{{ brand }} · <a href="/privacy/">Privacy policy</a> · <a href="/account-deletion/">Account &amp; data deletion</a></footer>
</body>
</html>
