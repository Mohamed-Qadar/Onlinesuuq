components:
  schemas:
    Action:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        confirmed:
          type: boolean
          default: false
        reference:
          type: string
          default: ''
          maxLength: 120
        reason:
          type: string
          default: ''
          maxLength: 300
      required:
      - action
    ActionEnum:
      enum:
      - ACCEPTED
      - PREPARING
      - DELIVERED
      - CANCELLED
      - PAID
      - REFUNDED
      - CORRECT_PAYMENT
      type: string
      description: |-
        * `ACCEPTED` - ACCEPTED
        * `PREPARING` - PREPARING
        * `DELIVERED` - DELIVERED
        * `CANCELLED` - CANCELLED
        * `PAID` - PAID
        * `REFUNDED` - REFUNDED
        * `CORRECT_PAYMENT` - CORRECT_PAYMENT
    Checkout:
      type: object
      properties:
        store:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLine'
        customer_name:
          type: string
          maxLength: 120
        phone:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          maxLength: 16
        fulfillment:
          $ref: '#/components/schemas/FulfillmentEnum'
        region:
          type: string
          default: ''
          maxLength: 100
        address:
          type: string
          default: ''
          maxLength: 500
        note:
          type: string
          default: ''
          maxLength: 500
      required:
      - customer_name
      - fulfillment
      - items
      - phone
      - store
    CheckoutLine:
      type: object
      properties:
        product:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 999
          minimum: 1
      required:
      - product
      - quantity
    CheckoutResult:
      type: object
      properties:
        tracking_token:
          type: string
        order:
          $ref: '#/components/schemas/Tracking'
      required:
      - order
      - tracking_token
    ConfigurationResult:
      type: object
      properties:
        brand_name:
          type: string
      required:
      - brand_name
    DashboardResult:
      type: object
      properties:
        active_products:
          type: integer
        new_orders:
          type: integer
        preparing_orders:
          type: integer
        seller_confirmed_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        low_stock:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
      - active_products
      - low_stock
      - new_orders
      - preparing_orders
      - seller_confirmed_total
    Event:
      type: object
      properties:
        action:
          type: string
          maxLength: 40
        reason:
          type: string
          maxLength: 500
        reference:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action
      - created_at
    FulfillmentEnum:
      enum:
      - pickup
      - delivery
      type: string
      description: |-
        * `pickup` - Pickup
        * `delivery` - Delivery
    GuestSessionResult:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - token
    Line:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - line_total
      - name
      - quantity
      - unit_price
    Login:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LogoUpload:
      type: object
      properties:
        image:
          type: string
          format: uri
      required:
      - image
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        fulfillment:
          allOf:
          - $ref: '#/components/schemas/FulfillmentEnum'
          readOnly: true
        region:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        payment:
          allOf:
          - $ref: '#/components/schemas/PaymentEnum'
          readOnly: true
        payment_instructions:
          readOnly: true
        payment_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        payment_confirmed_by:
          type: integer
          readOnly: true
          nullable: true
        payment_reference:
          type: string
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - customer_name
      - delivery_fee
      - events
      - fulfillment
