  /api/v1/tracking/:
    get:
      operationId: tracking_retrieve
      parameters:
      - in: header
        name: X-Tracking-Token
        schema:
          type: string
        required: true
      tags:
      - tracking
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
