          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Submit'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
          description: ''
  /api/v1/checkout/{key}/:
    get:
      operationId: checkout_retrieve
      parameters:
      - in: header
        name: X-Guest-Token
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - checkout
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
          description: ''
